name: TestFlight Upload

# Выгрузка «Призмы» в TestFlight. Запуск вручную: Actions → TestFlight Upload → Run workflow.
#
# Требуемые секреты (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID  — Team ID из Apple Developer (Membership, 10 символов)
#   ASC_KEY_ID     — ID ключа App Store Connect API (Users and Access → Integrations → Keys)
#   ASC_ISSUER_ID  — Issuer ID с той же страницы
#   ASC_KEY_P8     — содержимое скачанного файла AuthKey_XXXX.p8 целиком
#
# Ключ создавайте с ролью App Manager или Admin. Перед первой выгрузкой
# создайте запись приложения в App Store Connect (Apps → «+») с bundle ID
# com.prizma.newsapp — или поменяйте bundle ID в проекте на свой.

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive (Release, автоподпись через ASC API key)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/Prizma.xcodeproj \
            -scheme Prizma \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/Prizma.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID '${{ secrets.ASC_KEY_ID }}' \
            -authenticationKeyIssuerID '${{ secrets.ASC_ISSUER_ID }}' \
            DEVELOPMENT_TEAM='${{ secrets.APPLE_TEAM_ID }}' \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Write export options
        run: |
          cat > /tmp/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>TEAM_ID_PLACEHOLDER</string>
          </dict>
          </plist>
          EOF
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/" /tmp/ExportOptions.plist

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath /tmp/Prizma.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath /tmp/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID '${{ secrets.ASC_KEY_ID }}' \
            -authenticationKeyIssuerID '${{ secrets.ASC_ISSUER_ID }}'
