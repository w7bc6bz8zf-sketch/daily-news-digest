name: Collect News Data

on:
  schedule:
    # Дважды в день: утро и вечер по Москве (04:30 и 14:30 UTC)
    - cron: "30 4 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and cluster news
        env:
          MAX_STORIES: "60"
          HOURS_BACK:  "36"
          RU_SHARE:    "0.6"
        run: python collect_news.py

      - name: Commit news data to repo
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git add news_data.json news_compact.json
          git diff --staged --quiet || git commit -m "📰 News data $(date -u +'%Y-%m-%d %H:%M')"
          git push
